<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="2304" viewBox="0 0 4096 2304">
  <defs>
    <!-- brand logo gradients -->
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD93D"/><stop offset="100%" stop-color="#F4C430"/>
    </linearGradient>
    <linearGradient id="tealg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BCB77"/><stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D96FF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/><stop offset="100%" stop-color="#EE5A5A"/>
    </linearGradient>

    <!-- ambient background glows, matching site body::before -->
    <radialGradient id="glowTeal" cx="18%" cy="-2%" r="60%">
      <stop offset="0%" stop-color="#45C2AD" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#45C2AD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBrass" cx="88%" cy="4%" r="58%">
      <stop offset="0%" stop-color="#F4B740" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#F4B740" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="panelShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="40" stdDeviation="90" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- canvas -->
  <rect width="4096" height="2304" fill="#0D1413"/>
  <rect width="4096" height="2304" fill="url(#glowTeal)"/>
  <rect width="4096" height="2304" fill="url(#glowBrass)"/>

  <!-- faint tech grid -->
  <g stroke="rgba(230,240,237,0.028)" stroke-width="2">
    <line x1="512"  y1="0" x2="512"  y2="2304"/>
    <line x1="1024" y1="0" x2="1024" y2="2304"/>
    <line x1="1536" y1="0" x2="1536" y2="2304"/>
    <line x1="2048" y1="0" x2="2048" y2="2304"/>
    <line x1="2560" y1="0" x2="2560" y2="2304"/>
    <line x1="3072" y1="0" x2="3072" y2="2304"/>
    <line x1="3584" y1="0" x2="3584" y2="2304"/>
    <line x1="0" y1="576"  x2="4096" y2="576"/>
    <line x1="0" y1="1152" x2="4096" y2="1152"/>
    <line x1="0" y1="1728" x2="4096" y2="1728"/>
  </g>

  <!-- decorative network nodes (open-source / connection motif) -->
  <g stroke="rgba(230,240,237,0.05)" stroke-width="2.5">
    <line x1="360" y1="470" x2="3060" y2="330"/>
    <line x1="3060" y1="330" x2="3760" y2="560"/>
    <line x1="360" y1="470" x2="300" y2="1980"/>
  </g>
  <g fill="rgba(69,194,173,0.28)">
    <circle cx="360" cy="470" r="9"/>
    <circle cx="3060" cy="330" r="9"/>
    <circle cx="3760" cy="560" r="9"/>
    <circle cx="300" cy="1980" r="9"/>
  </g>

  <!-- ===================== LEFT COLUMN ===================== -->

  <!-- brand lockup: logo mark + wordmark -->
  <svg x="300" y="360" width="150" height="150" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="112" fill="#1C1C1E"/>
    <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
      <line x1="128" y1="0" x2="128" y2="512"/><line x1="256" y1="0" x2="256" y2="512"/>
      <line x1="384" y1="0" x2="384" y2="512"/><line x1="0" y1="128" x2="512" y2="128"/>
      <line x1="0" y1="256" x2="512" y2="256"/><line x1="0" y1="384" x2="512" y2="384"/>
    </g>
    <rect x="96" y="200" width="200" height="120" rx="16" fill="url(#tealg)" filter="url(#soft)" transform="rotate(-12, 196, 260)"/>
    <rect x="240" y="140" width="140" height="140" rx="16" fill="url(#amber)" filter="url(#soft)" transform="rotate(8, 310, 210)"/>
    <g filter="url(#soft)">
      <rect x="176" y="176" width="160" height="200" rx="20" fill="url(#sky)"/>
      <text x="216" y="290" font-family="Source Code Pro, monospace" font-size="48" font-weight="600" fill="rgba(255,255,255,0.9)" letter-spacing="-2">&lt;/&gt;</text>
    </g>
    <circle cx="340" cy="340" r="38" fill="none" stroke="url(#coral)" stroke-width="2" opacity="0.4"/>
    <circle cx="340" cy="340" r="32" fill="url(#coral)" filter="url(#soft)"/>
    <g transform="translate(340, 340)">
      <path d="M-7,-5 L-7,-9 A7,7 0 0,1 7,-9 L7,-5" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <rect x="-9" y="-5" width="18" height="13" rx="2.5" fill="white"/>
    </g>
  </svg>
  <text x="490" y="470" font-family="Nimbus Roman, serif" font-size="82" fill="#EEF3F1">OneKash Labs</text>

  <!-- eyebrow -->
  <text x="304" y="720" font-family="Source Code Pro, monospace" font-size="40" font-weight="600" letter-spacing="6" fill="#F4B740">// OPEN-SOURCE LAB</text>

  <!-- headline -->
  <g font-family="Nimbus Roman, serif" fill="#EEF3F1" font-size="228">
    <text x="298" y="960" letter-spacing="-4">Experiments that</text>
    <text x="298" y="1200" letter-spacing="-4">escaped the lab</text>
  </g>

  <!-- subtitle -->
  <g font-family="Barlow, sans-serif" fill="#A9B7B2" font-size="66">
    <text x="304" y="1400">A small open-source lab, best known</text>
    <text x="304" y="1490">(of all things) for a calendar.</text>
  </g>

  <!-- terminal pill: the domain -->
  <g>
    <rect x="304" y="1640" width="720" height="132" rx="66" fill="none" stroke="rgba(230,240,237,0.15)" stroke-width="2.5"/>
    <text x="356" y="1725" font-family="Source Code Pro, monospace" font-size="52" font-weight="500" xml:space="preserve"><tspan fill="#7C8B86">$ </tspan><tspan fill="#45C2AD">open onekash.org</tspan></text>
  </g>

  <!-- ethos chip line -->
  <g font-family="Source Code Pro, monospace" font-size="46" font-weight="500">
    <text x="304" y="1970" xml:space="preserve"><tspan fill="#A9B7B2">privacy-first</tspan><tspan fill="#45C2AD">  ·  </tspan><tspan fill="#A9B7B2">on-device</tspan><tspan fill="#45C2AD">  ·  </tspan><tspan fill="#A9B7B2">no tracking</tspan><tspan fill="#45C2AD">  ·  </tspan><tspan fill="#A9B7B2">no accounts</tspan></text>
  </g>

  <!-- ===================== RIGHT COLUMN: privacy netlog panel ===================== -->
  <text x="2340" y="700" font-family="Source Code Pro, monospace" font-size="46" font-weight="500" fill="#A9B7B2">Here's what we send to our servers:</text>

  <g filter="url(#panelShadow)">
    <rect x="2340" y="760" width="1456" height="864" rx="40" fill="#14201E" stroke="rgba(230,240,237,0.09)" stroke-width="2.5"/>
    <!-- title bar -->
    <rect x="2340" y="760" width="1456" height="120" rx="40" fill="rgba(0,0,0,0.2)"/>
    <rect x="2340" y="840" width="1456" height="40" fill="#14201E"/>
    <line x1="2340" y1="880" x2="3796" y2="880" stroke="rgba(230,240,237,0.09)" stroke-width="2.5"/>
    <circle cx="2410" cy="820" r="16" fill="#e06c62"/>
    <circle cx="2462" cy="820" r="16" fill="#e0b862"/>
    <circle cx="2514" cy="820" r="16" fill="#63c98a"/>
    <text x="2570" y="835" font-family="Source Code Pro, monospace" font-size="40" font-weight="500" fill="#7C8B86">Network</text>

    <!-- column header -->
    <g font-family="Source Code Pro, monospace" font-size="34" font-weight="500" fill="#7C8B86" letter-spacing="3">
      <text x="2410" y="985">NAME</text>
      <text x="3020" y="985">TYPE</text>
      <text x="3560" y="985">SIZE</text>
    </g>
    <line x1="2340" y1="1030" x2="3796" y2="1030" stroke="rgba(230,240,237,0.09)" stroke-width="2.5"/>

    <!-- empty state -->
    <text x="3068" y="1290" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="66" font-weight="500" fill="#45C2AD">— no requests —</text>
    <text x="3068" y="1370" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="44" fill="#7C8B86">nothing left your device</text>

    <!-- footer -->
    <line x1="2340" y1="1500" x2="3796" y2="1500" stroke="rgba(230,240,237,0.09)" stroke-width="2.5"/>
    <rect x="2340" y="1500" width="1456" height="124" rx="0" fill="rgba(0,0,0,0.14)"/>
    <rect x="3756" y="1500" width="40" height="124" fill="#14201E"/>
    <rect x="3756" y="1500" width="40" height="84" fill="rgba(0,0,0,0.14)"/>
    <path d="M3756 1584 h40 v0 a40 40 0 0 1 -40 40 z" fill="#14201E"/>
    <text x="2410" y="1580" font-family="Source Code Pro, monospace" font-size="40" font-weight="500" xml:space="preserve"><tspan fill="#45C2AD">0 requests</tspan><tspan fill="#7C8B86" opacity="0.4">  ·  </tspan><tspan fill="#7C8B86">0 B transferred</tspan><tspan fill="#7C8B86" opacity="0.4">  ·  </tspan><tspan fill="#7C8B86">0 trackers</tspan><tspan fill="#7C8B86" opacity="0.4">  ·  </tspan><tspan fill="#7C8B86">0 accounts</tspan></text>
  </g>
</svg>
